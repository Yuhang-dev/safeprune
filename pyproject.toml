[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeprune-dpo"
version = "0.1.0"
description = "SafePrune-DPO research scaffold for alignment-preserving structured pruning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "PyYAML>=6.0.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.10.0",
]

[project.optional-dependencies]
eval = [
  "lm-eval>=0.4.4",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

