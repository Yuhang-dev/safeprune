[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ffn-pruning"
version = "0.1.0"
description = "Trajectory-aware dynamic FFN pruning scaffold for reasoning agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate==0.34.2",
  "datasets==2.21.0",
  "peft==0.12.0",
  "PyYAML>=6.0.0",
  "swanlab==0.8.1",
  "torch==2.6.0",
  "transformers==4.44.2",
  "trl==0.10.1",
]

[project.optional-dependencies]
eval = [
  "lm-eval>=0.4.4",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
