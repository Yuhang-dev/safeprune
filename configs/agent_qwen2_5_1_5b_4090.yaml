extends: configs/safeprune_qwen2_5_7b.yaml

experiment:
  name: agent_qwen2_5_1_5b_4090
  output_dir: outputs/agent_qwen2_5_1_5b_4090

model:
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  teacher_model: null
  torch_dtype: bfloat16
  use_flash_attention_2: false

data:
  preference_train: data/preference/train.jsonl
  calibration: data/agent/controlled_tasks.jsonl
  max_length: 1024
  max_prompt_length: 512

pruning:
  sparsity: 0.30
  target_sparsities: [0.10, 0.20, 0.30]
  prune_attention_heads: false
  prune_mlp_channels: true
  scores_dir: outputs/agent_qwen2_5_1_5b_4090/prune_scores
  pruned_dir: outputs/agent_qwen2_5_1_5b_4090/pruned

agent:
  task_path: data/agent/controlled_tasks.jsonl
  calibration_path: data/agent/controlled_tasks.jsonl
  mask_bank_dir: outputs/agent_qwen2_5_1_5b_4090/mask_bank
  target_sparsities: [0.10, 0.20, 0.30]
  stage_sparsities:
    plan: 0.10
    act: 0.20
    observe: 0.30
    reflect: 0.10
    answer: 0.30
  failure_sparsity: 0.10
  default_sparsity: 0.30
  recovery_window_steps: 2

evaluation:
  output_dir: outputs/agent_qwen2_5_1_5b_4090/eval

tracking:
  enabled: true
  backend: swanlab
  project: agent-ffn-pruning-4090
  tags: ["4090", agent, qwen2.5-1.5b, ffn-only]
